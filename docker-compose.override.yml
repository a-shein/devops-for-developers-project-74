services:
  app:
    build:
      dockerfile: Dockerfile
    env_file:
      - path: ./app/.env
        required: false
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"
    command:
      ["make", "dev"]
  caddy:
    image: caddy
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
